<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UCE Conveyance Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-light p-3">

<div class="container" style="max-width: 800px;">
  <!-- HEADER & BACK BUTTON -->
  <div class="d-flex justify-content-between align-items-center bg-white p-3 rounded shadow-sm mb-3">
    <div>
      <h5 class="fw-bold text-primary mb-0"><i class="fa fa-motorcycle me-2"></i>Field Visit & Conveyance</h5>
      <small class="text-muted" id="userRoleSubtitle">Loading user...</small>
    </div>
    <div class="d-flex gap-2">
      <button class="btn btn-sm btn-outline-success" onclick="exportToCSV()"><i class="fa fa-file-excel me-1"></i> Export Excel</button>
      <button class="btn btn-sm btn-outline-dark" id="backToPortalBtn" onclick="goBackToPortal()"><i class="fa fa-arrow-left me-1"></i> Back</button>
    </div>
  </div>

  <!-- EXPENSE FORM -->
  <div class="card p-4 shadow-sm mb-4 border-0 rounded-4">
    <h6 class="fw-bold text-dark mb-3"><i class="fa fa-plus-circle me-1 text-primary"></i> Log New Visit & Expenses</h6>
    <form id="conveyanceForm" onsubmit="submitConveyanceForm(event)">
      <div class="row g-2">
        <div class="col-md-4">
          <label class="form-label small fw-bold">Visit Date *</label>
          <input type="date" id="cnvDate" class="form-control form-control-sm" required>
        </div>
        <div class="col-md-4">
          <label class="form-label small fw-bold">Client / Site Name *</label>
          <input type="text" id="cnvClient" class="form-control form-control-sm" placeholder="Company / Site name" required>
        </div>
        <div class="col-md-4">
          <label class="form-label small fw-bold">Purpose of Visit *</label>
          <input type="text" id="cnvPurpose" class="form-control form-control-sm" placeholder="Installation, Service, etc." required>
        </div>

        <div class="col-md-4">
          <label class="form-label small fw-bold">Travel Mode *</label>
          <select id="cnvType" class="form-select form-select-sm" onchange="toggleTravelModeFields()">
            <option value="Bike">Bike (Auto KM @ ₹3.5/km)</option>
            <option value="Cab">Cab / Taxi (Manual Fare)</option>
            <option value="Public">Public Conveyance (Manual Fare)</option>
          </select>
        </div>

        <div class="col-md-4 bike-field">
          <label class="form-label small fw-bold">Start Meter Reading</label>
          <input type="number" id="cnvStartMeter" class="form-control form-control-sm" placeholder="e.g. 12450" oninput="calculateBikeExpense()">
        </div>
        <div class="col-md-4 bike-field">
          <label class="form-label small fw-bold">End Meter Reading</label>
          <input type="number" id="cnvEndMeter" class="form-control form-control-sm" placeholder="e.g. 12510" oninput="calculateBikeExpense()">
        </div>

        <div class="col-md-4 manual-field d-none">
          <label class="form-label small fw-bold">Travel Fare Amount (₹) *</label>
          <input type="number" id="cnvTravelAmt" class="form-control form-control-sm" placeholder="0.00" value="0" oninput="calculateTotalAmount()">
        </div>

        <div class="col-md-4">
          <label class="form-label small fw-bold">Meter / Bill Photo (Optional)</label>
          <input type="file" id="cnvImageFile" class="form-control form-control-sm" accept="image/*">
        </div>

        <div class="col-md-4">
          <label class="form-label small fw-bold">Other Expenses (Food/Stay) (₹)</label>
          <input type="number" id="cnvOtherAmt" class="form-control form-control-sm" placeholder="0.00" value="0" oninput="calculateTotalAmount()">
        </div>

        <div class="col-12 bg-light p-2 rounded border mt-2 d-flex justify-content-between align-items-center">
          <div>
            <span class="small text-muted">Total KM: <b id="lblTotalKm">0</b> KM</span> | 
            <span class="small text-muted">Travel Cost: ₹<b id="lblTravelCost">0</b></span>
          </div>
          <div>
            <h6 class="fw-bold text-success m-0">Total Claim: ₹<span id="lblTotalClaim">0</span></h6>
          </div>
        </div>

        <div class="col-12">
          <label class="form-label small fw-bold">Remarks / Notes</label>
          <input type="text" id="cnvRemarks" class="form-control form-control-sm" placeholder="Any extra details...">
        </div>

        <div class="col-12 text-end mt-3">
          <button type="submit" id="cnvSubmitBtn" class="btn btn-primary btn-sm fw-bold px-4">Submit Expense Claim</button>
        </div>
      </div>
    </form>
  </div>

  <!-- RECORDS TABLE & HISTORY -->
  <div class="card p-4 shadow-sm border-0 rounded-4 mb-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h6 class="fw-bold text-dark m-0">Visit & Expense History</h6>
      <span class="badge bg-success p-2">Monthly Total: ₹<span id="monthlyTotalDisplay">0</span></span>
    </div>
    <div class="table-responsive">
      <table class="table table-sm table-hover align-middle small">
        <thead class="table-dark">
          <tr>
            <th>Date</th>
            <th>User / Client</th>
            <th>Mode</th>
            <th>Total (₹)</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="conveyanceTableBody">
          <tr><td colspan="5" class="text-center text-muted py-3">Loading records...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- DETAIL VIEW MODAL -->
<div class="modal fade" id="detailModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 shadow rounded-4">
      <div class="modal-header bg-primary text-white">
        <h6 class="modal-title fw-bold"><i class="fa fa-info-circle me-1"></i> Visit Details</h6>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body small" id="modalDetailBody">
        <!-- Dynamically filled -->
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  const APPS_SCRIPT_API_URL = "https://script.google.com/macros/s/AKfycbxeS23zbPNegYQjszbE5-Iqcw4ySVUy8Yddi6HE3RcFInfYUvSJtMpeR1XdNbM_Lne8/exec";
  
  let loggedInUser = JSON.parse(localStorage.getItem('sales_portal_session') || '{"salesPerson":"Test User", "role":"Sales Person"}');
  let capturedLocation = '';
  let globalRecords = [];

  window.addEventListener('DOMContentLoaded', () => {
    if (!loggedInUser || !loggedInUser.salesPerson) {
      loggedInUser = { salesPerson: "User", role: "Sales Person" };
    }
    
    // Restriction logic: If user is Engineer/Employee/Delivery (Not Admin/Manager/Sales), hide back to portal if needed or adjust back button
    const roleLower = String(loggedInUser.role || '').toLowerCase();
    const isRestrictedRole = roleLower.indexOf('engineer') > -1 || roleLower.indexOf('delivery') > -1 || roleLower.indexOf('employee') > -1;
    if (isRestrictedRole) {
      document.getElementById('backToPortalBtn').style.display = 'none'; // Only conveyance access
    }

    document.getElementById('cnvDate').value = new Date().toISOString().split('T')[0];
    document.getElementById('userRoleSubtitle').innerText = `${loggedInUser.salesPerson} (${loggedInUser.role || 'User'})`;
    
    captureGeoLocation();
    loadConveyanceHistory();
  });

  function goBackToPortal() {
    window.location.href = "index.html"; // Adjust to your main portal page if different
  }

  function captureGeoLocation() {
    if ("geolocation" in navigator) {
      navigator.geolocation.getCurrentPosition(pos => {
        capturedLocation = `${pos.coords.latitude.toFixed(4)}, ${pos.coords.longitude.toFixed(4)}`;
      }, err => { capturedLocation = ''; }, { timeout: 10000 });
    }
  }

  function toggleTravelModeFields() {
    const type = document.getElementById('cnvType').value;
    const bikeFields = document.querySelectorAll('.bike-field');
    const manualField = document.querySelector('.manual-field');

    if (type === 'Bike') {
      bikeFields.forEach(el => el.classList.remove('d-none'));
      manualField.classList.add('d-none');
    } else {
      bikeFields.forEach(el => el.classList.add('d-none'));
      manualField.classList.remove('d-none');
    }
    calculateTotalAmount();
  }

  function calculateBikeExpense() {
    const start = parseFloat(document.getElementById('cnvStartMeter').value) || 0;
    const end = parseFloat(document.getElementById('cnvEndMeter').value) || 0;
    let km = (end > start) ? (end - start) : 0;

    document.getElementById('lblTotalKm').innerText = km;
    const bikeCost = km * 3.5;
    document.getElementById('lblTravelCost').innerText = bikeCost.toFixed(2);
    calculateTotalAmount();
  }

  function calculateTotalAmount() {
    const type = document.getElementById('cnvType').value;
    let travelAmt = (type === 'Bike') ? (parseFloat(document.getElementById('lblTravelCost').innerText) || 0) : (parseFloat(document.getElementById('cnvTravelAmt').value) || 0);
    const otherAmt = parseFloat(document.getElementById('cnvOtherAmt').value) || 0;
    document.getElementById('lblTotalClaim').innerText = (travelAmt + otherAmt).toFixed(2);
  }

  async function callAppsScriptApi(action, data = {}) {
    try {
      const response = await fetch(APPS_SCRIPT_API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: action, data: data })
      });
      return await response.json();
    } catch (error) {
      console.error("API Error:", error);
      return { success: false, message: error.toString() };
    }
  }

  async function submitConveyanceForm(e) {
    e.preventDefault();
    const btn = document.getElementById('cnvSubmitBtn');
    btn.disabled = true; btn.innerText = 'Submitting...';

    const type = document.getElementById('cnvType').value;
    const startMeter = parseFloat(document.getElementById('cnvStartMeter').value) || 0;
    const endMeter = parseFloat(document.getElementById('cnvEndMeter').value) || 0;
    const totalKm = type === 'Bike' ? (endMeter > startMeter ? endMeter - startMeter : 0) : 0;
    const bikeAmt = type === 'Bike' ? totalKm * 3.5 : 0;
    const otherAmt = parseFloat(document.getElementById('cnvOtherAmt').value) || 0;
    const travelAmt = type === 'Bike' ? bikeAmt : (parseFloat(document.getElementById('cnvTravelAmt').value) || 0);
    const totalAmt = travelAmt + otherAmt;

    let imageUrl = '';
    const fileInput = document.getElementById('cnvImageFile');
    if (fileInput.files && fileInput.files[0]) {
      imageUrl = await convertFileToBase64(fileInput.files[0]);
    }

    const payload = {
      date: document.getElementById('cnvDate').value,
      salesPerson: loggedInUser.salesPerson || 'User',
      client: document.getElementById('cnvClient').value,
      purpose: document.getElementById('cnvPurpose').value,
      type: type,
      startMeter: startMeter,
      endMeter: endMeter,
      totalKm: totalKm,
      bikeAmt: bikeAmt,
      otherAmt: otherAmt,
      totalAmt: totalAmt,
      location: capturedLocation,
      imageUrl: imageUrl,
      remarks: document.getElementById('cnvRemarks').value
    };

    const res = await callAppsScriptApi('saveConveyanceExpense', payload);
    btn.disabled = false; btn.innerText = 'Submit Expense Claim';

    if (res && res.success) {
      showCreativeToast("Success!", res.message || "Expense submitted successfully!", "success");
      document.getElementById('conveyanceForm').reset();
      document.getElementById('cnvDate').value = new Date().toISOString().split('T')[0];
      toggleTravelModeFields();
      loadConveyanceHistory();
    } else {
      showCreativeToast("Error", res ? res.message : "Failed to submit expense.", "danger");
    }
  }

  function convertFileToBase64(file) {
    return new Promise((resolve) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.readAsDataURL(file);
    });
  }

  async function loadConveyanceHistory() {
    const tbody = document.getElementById('conveyanceTableBody');
    tbody.innerHTML = `<tr><td colspan="5" class="text-center text-muted py-3"><i class="fa fa-spinner fa-spin me-1"></i> Loading records...</td></tr>`;

    const res = await callAppsScriptApi('getConveyanceData', { user: loggedInUser });
    
    if (!res || !res.success) {
      tbody.innerHTML = `<tr><td colspan="5" class="text-center text-danger py-3">Failed to load history</td></tr>`;
      return;
    }

    globalRecords = res.records || [];
    let html = '';
    let monthlySum = 0;

    globalRecords.forEach((r, idx) => {
      monthlySum += Number(r.totalAmt) || 0;

      html += `
        <tr>
          <td>${r.date}</td>
          <td><b>${r.salesPerson}</b><br><small class="text-muted">${r.client}</small></td>
          <td><span class="badge bg-secondary">${r.type}</span></td>
          <td class="fw-bold text-success">₹${r.totalAmt}</td>
          <td>
            <button class="btn btn-xs btn-outline-primary py-0 px-2" onclick="openDetailModal(${idx})" style="font-size: 0.75rem;"><i class="fa fa-eye"></i> View</button>
          </td>
        </tr>
      `;
    });

    tbody.innerHTML = html || '<tr><td colspan="5" class="text-center text-muted py-3">No records found.</td></tr>';
    document.getElementById('monthlyTotalDisplay').innerText = monthlySum.toLocaleString();
  }

  function openDetailModal(idx) {
    const r = globalRecords[idx];
    if (!r) return;

    let photoBlock = r.imageUrl ? `<a href="${r.imageUrl}" target="_blank" class="btn btn-sm btn-outline-primary mt-1"><i class="fa fa-image me-1"></i> View Attached Bill/Photo</a>` : '<span class="text-muted">No Photo Attached</span>';
    let locBlock = r.location ? `<a href="https://maps.google.com/?q=${r.location}" target="_blank" class="text-decoration-none text-danger"><i class="fa fa-map-marker-alt me-1"></i> ${r.location}</a>` : 'Not Captured';

    let content = `
      <div class="mb-2"><b>Submitted By:</b> ${r.salesPerson}</div>
      <div class="mb-2"><b>Date:</b> ${r.date}</div>
      <div class="mb-2"><b>Client / Site:</b> ${r.client}</div>
      <div class="mb-2"><b>Purpose:</b> ${r.purpose}</div>
      <div class="mb-2"><b>Travel Mode:</b> <span class="badge bg-secondary">${r.type}</span></div>
      ${r.type === 'Bike' ? `<div class="mb-2"><b>Meter Reading:</b> Start: ${r.startMeter} | End: ${r.endMeter} | Total KM: <b>${r.totalKm} KM</b></div>` : ''}
      <div class="mb-2"><b>Other Expenses:</b> ₹${r.otherAmt}</div>
      <div class="mb-2 text-success fw-bold">Total Claim Amount: ₹${r.totalAmt}</div>
      <div class="mb-2"><b>Remarks:</b> ${r.remarks || 'None'}</div>
      <div class="mb-2"><b>Location:</b> ${locBlock}</div>
      <div class="mt-3">${photoBlock}</div>
    `;

    document.getElementById('modalDetailBody').innerHTML = content;
    new bootstrap.Modal(document.getElementById('detailModal')).show();
  }

  function exportToCSV() {
    if (!globalRecords || globalRecords.length === 0) {
      showCreativeToast("Notice", "No records available to export.", "danger");
      return;
    }

    let csvContent = "data:text/csv;charset=utf-8,";
    csvContent += "ID,Date,SalesPerson,Client,Purpose,Type,StartMeter,EndMeter,TotalKM,BikeAmt,OtherAmt,TotalAmt,Remarks,Location\r\n";

    globalRecords.forEach(r => {
      let row = [r.id, r.date, `"${r.salesPerson}"`, `"${r.client}"`, `"${r.purpose}"`, r.type, r.startMeter, r.endMeter, r.totalKm, r.bikeAmt, r.otherAmt, r.totalAmt, `"${r.remarks || ''}"`, `"${r.location || ''}"`];
      csvContent += row.join(",") + "\r\n";
    });

    const encodedUri = encodeURI(csvContent);
    const link = document.createElement("a");
    link.setAttribute("href", encodedUri);
    link.setAttribute("download", `Conveyance_Report_${new Date().toISOString().slice(0,10)}.csv`);
    document.body.appendChild(link);
    link.click();
    document.removeEventListener("click", link);
  }

  function showCreativeToast(title, message, type = 'success') {
    let existingToast = document.getElementById('creativeToastContainer');
    if (existingToast) existingToast.remove();

    const bgCol = type === 'success' ? 'linear-gradient(135deg, #10b981, #059669)' : 'linear-gradient(135deg, #ef4444, #dc2626)';
    const icon = type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle';

    const toastHTML = `
      <div id="creativeToastContainer" style="position: fixed; top: 20px; right: 20px; z-index: 99999; animation: slideInDown 0.4s ease, fadeOut 0.4s ease 3.6s;">
        <div style="background: ${bgCol}; color: white; padding: 14px 20px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); display: flex; align-items: center; gap: 12px; min-width: 280px; font-family: sans-serif;">
          <i class="fa ${icon} fs-4"></i>
          <div>
            <div style="font-weight: bold; font-size: 0.95rem;">${title}</div>
            <div style="font-size: 0.82rem; opacity: 0.9;">${message}</div>
          </div>
        </div>
      </div>
      <style>
        @keyframes slideInDown { from { transform: translateY(-30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }
      </style>
    `;
    document.body.insertAdjacentHTML('beforeend', toastHTML);
    setTimeout(() => {
      let t = document.getElementById('creativeToastContainer');
      if (t) t.remove();
    }, 4000);
  }
</script>

</body>
</html>
